project:
  name: commons-security
  description: Developer-friendly cryptography utilities for Java
  longDescription: |
    Commons Security is a developer-focused Java cryptography library built on top
    of JCA/JCE and BouncyCastle. It provides a clean, type-safe, and fluent API
    for encryption, hashing, signatures, password encoding, and secret sharing.
  authors:
    - Avec112
  license: Apache-2.0
  inceptionYear: 2024
  languages:
    java:
      groupId: io.github.avec112
      version: 11
      multiProject: true
  links:
    homepage: https://github.com/Avec112/commons-security
    vcsBrowser: https://github.com/Avec112/commons-security
    bugTracker: https://github.com/Avec112/commons-security/issues

release:
  github:
    owner: Avec112
    name: commons-security
    tagName: v{{projectVersion}}
    releaseName: "commons-security {{projectVersion}}"
    overwrite: true
    changelog:
      enabled: true
      preset: conventional-commits
      contributors:
        enabled: true
        format: "- {{contributorName}}{{#contributorUsernameAsLink}} ({{.}}){{/contributorUsernameAsLink}}"

signing:
  pgp:
    active: ALWAYS
    armored: true
    mode: COMMAND
    passphrase: "{{env.JRELEASER_GPG_PASSPHRASE}}"

deploy:
  maven:
    mavenCentral:
      sonatype:
        active: RELEASE
        url: https://central.sonatype.com/api/v1/publisher
        snapshotSupported: false
        applyMavenCentralRules: true
        stagingRepositories:
          - target/staging-deploy
        authorization: BASIC
        verifyPom: true
        sourceJar: true
        javadocJar: true
        sign: true
        checksums: true
